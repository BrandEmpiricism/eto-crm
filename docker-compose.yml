services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: eto_crm_admin
      POSTGRES_PASSWORD: local-admin-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eto_crm_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - eto_crm_postgres:/var/lib/postgresql/data
      - ./dev/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
volumes:
  eto_crm_postgres:

