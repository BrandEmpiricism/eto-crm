services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eto_crm
      POSTGRES_USER: eto_crm
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eto_crm -d eto_crm"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["eto_crm_postgres:/var/lib/postgresql/data"]
volumes:
  eto_crm_postgres:

